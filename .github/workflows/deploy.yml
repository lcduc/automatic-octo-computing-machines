name: Deploy

# Updates the Windows demo server after CI passes on main. Runs on a self-hosted runner installed
# on that server, so no server credentials or open ports are needed. It is triggered only by the
# CI run of main (never by pull requests or forks).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits for the running one instead of interrupting a migration.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the demo server
    # Only a push to this repository's main may deploy. A pull request from a fork can show up as a CI run
    # on a branch named "main"; without the event and repository checks it would run its own deploy.ps1
    # on the server's runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, windows, chatbot-demo]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: deploy/windows
      - name: Update the server
        shell: powershell
        run: ./deploy/windows/deploy.ps1
