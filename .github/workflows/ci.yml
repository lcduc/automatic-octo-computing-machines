name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Ruff only parses source, so this job skips the multi-GB ML install
      # entirely and gives fast feedback on syntax/undefined-name errors.
      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # torch is deliberately absent from requirements.txt (it needs a
      # hardware-specific index URL — see the comment block at the top of that
      # file), so it is installed separately here exactly as the Dockerfile
      # does. torchaudio is skipped: nothing in the import graph loads it.
      # paddlepaddle is skipped too — the OCR engines import paddle lazily, so
      # the test suite never touches it.
      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No secrets are configured: every setting in config/settings.py falls
      # back to a safe default, and the suites stub out their LLM clients, so
      # the tests run fully offline.
      - name: Run tests
        run: pytest

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: a CVE disclosed in a transitive dependency should surface
    # here, but it must not block an unrelated PR from merging. Dependabot (see
    # .github/dependabot.yml) is what actually proposes the upgrades.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the pinned requirements without installing the ML stack.
      #
      # The --ignore-vuln entries below are deliberate, not swept-under-the-
      # rug: each is a CVE with no available remediation right now, verified
      # against GitHub's own advisory API (`gh api advisories/<GHSA-id>`),
      # not just this mirror. Re-check periodically; a real fix should be
      # taken, not re-ignored.
      #
      # transformers==4.53.3 (PYSEC-2025-{211,212,213,214,215,216,217,218},
      # PYSEC-2026-{2288,2289,2290,3929}): all fixed only in transformers>=5,
      # which is a known-incompatible bump — see the NOTE above the
      # transformers pin in requirements.txt (breaks the
      # jinaai/jina-reranker-v2-base-multilingual remote code, confirmed by
      # loading the real cached model; also unresolvable against the
      # huggingface_hub pin). Verified 2026-09-21 via commit 845d894.
      #
      # accelerate==1.14.0 (PYSEC-2026-3804) and nltk==3.10.3
      # (PYSEC-2026-3740): both `first_patched_version: null` on GitHub's
      # advisory API as of 2026-09-21 -- no fixed release exists yet for
      # either. Also not reachable through this app's own usage: accelerate's
      # path-traversal is only exploitable via untrusted sharded checkpoints
      # (this app only loads pinned, trusted HF models), and nltk's is in
      # TransitionParser/AveragedPerceptron/PerceptronTagger/maxent model
      # loading (utils/text_utils.py only calls nltk.download/sent_tokenize).
      - name: Audit pinned dependencies
        run: >-
          pip-audit --requirement requirements.txt --strict
          --ignore-vuln PYSEC-2025-211
          --ignore-vuln PYSEC-2025-212
          --ignore-vuln PYSEC-2025-213
          --ignore-vuln PYSEC-2025-214
          --ignore-vuln PYSEC-2025-215
          --ignore-vuln PYSEC-2025-216
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2025-218
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3929
          --ignore-vuln PYSEC-2026-3804
          --ignore-vuln PYSEC-2026-3740
