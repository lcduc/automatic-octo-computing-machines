name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Ruff only parses source, so this job skips the multi-GB ML install
      # entirely and gives fast feedback on syntax/undefined-name errors.
      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests (test/integration) run against a real pgvector database.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot_ci
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://chatbot:chatbot_ci@localhost:5432/chatbot_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt

      # torch is deliberately absent from requirements.txt (it needs a
      # hardware-specific index URL — see requirements-torch.txt), so it is
      # installed separately here at the same pinned versions as the Dockerfile.
      # torchaudio is skipped: nothing in the import graph loads it.
      # paddlepaddle is skipped too — the OCR engines import paddle lazily, so
      # the test suite never touches it.
      - name: Install CPU torch
        run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No secrets are configured: every setting in config/settings.py falls
      # back to a safe default, and the suites stub out their LLM clients, so
      # the tests run fully offline.
      # The migration history must apply cleanly to an empty database.
      - name: Check migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      # EVAL-09: must pass 100% before any merge (tier gating, per-user data isolation, retrieval filters).
      - name: Hard gates
        run: pytest -m hard_gate -v

      - name: Red team (prompt injection)
        run: pytest -m red_team -v

      - name: Run tests
        run: pytest

      # Router regression gate: fails when a real question is taken by a shortcut or accuracy drops
      # past the tolerance in scripts/eval_baseline.py. It needs only the small embedding model
      # (~470 MB), cached so a PR does not re-download it. No LLM, no secrets. The retrieval eval
      # (database + the 2.2 GB reranker) runs nightly in eval-nightly.yml.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: model_weights/models--intfloat--multilingual-e5-small
          key: model-e5-small-v1

      - name: Router eval (regression gate)
        run: >-
          python -m scripts.eval_router --check
          --golden-set scripts/demo_data/golden_colloquial_dev.json
          --golden-set scripts/demo_data/golden_colloquial_holdout.json
          --golden-set scripts/demo_data/golden_queries.json

  widget:
    name: Chat widget (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontends/widget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontends/widget/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  admin-web:
    name: Admin web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontends/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontends/admin/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: a CVE disclosed in a transitive dependency should surface
    # here, but it must not block an unrelated PR from merging. Dependabot (see
    # .github/dependabot.yml) is what actually proposes the upgrades.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the pinned requirements without installing the ML stack.
      #
      # The --ignore-vuln entries below are deliberate, not swept-under-the-
      # rug: each is a CVE with no available remediation right now, verified
      # against GitHub's own advisory API (`gh api advisories/<GHSA-id>`),
      # not just this mirror. Re-check periodically; a real fix should be
      # taken, not re-ignored.
      #
      # accelerate==1.14.0 (PYSEC-2026-3804) and nltk==3.10.3
      # (PYSEC-2026-3740): both `first_patched_version: null` on GitHub's
      # advisory API as of 2026-09-21 -- no fixed release exists yet for
      # either. Also not reachable through this app's own usage: accelerate's
      # path-traversal is only exploitable via untrusted sharded checkpoints
      # (this app only loads pinned, trusted HF models), and nltk's is in
      # TransitionParser/AveragedPerceptron/PerceptronTagger/maxent model
      # loading (utils/text_utils.py only calls nltk.download/sent_tokenize).
      #
      # pillow 12.3.0 (CVE-2026-112xxx and CVE-2026-96xxx, published from
      # 2026-10-19): fixed only in pillow 13.0.0 (no 12.x backport on GitHub's
      # advisory API), which nothing here can install yet: docling,
      # docling-core, docling-ibm-models and streamlit, latest releases
      # included, all require pillow<13 (checked 2026-10-21). They are image
      # decoder bugs (TIFF, GIF, EPS, PDF page tree, morph). Files reach Pillow
      # only through uploads by signed-in staff (owner/editor or a
      # documents-write key; .pdf/.docx/.xlsx/text only), parsed in the
      # memory-capped ingestion worker; EPS needs Ghostscript, which the image
      # does not install. Drop these and pin pillow>=13 once docling and
      # streamlit allow it.
      - name: Audit pinned dependencies
        run: >-
          pip-audit --requirement requirements.txt --strict
          --ignore-vuln PYSEC-2026-3804
          --ignore-vuln PYSEC-2026-3740
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112899
          --ignore-vuln CVE-2026-112390
          --ignore-vuln CVE-2026-112391
          --ignore-vuln CVE-2026-112392
          --ignore-vuln CVE-2026-112393
          --ignore-vuln CVE-2026-112396
          --ignore-vuln CVE-2026-112398
          --ignore-vuln CVE-2026-112399
          --ignore-vuln CVE-2026-112401
          --ignore-vuln CVE-2026-112402
          --ignore-vuln CVE-2026-112405
          --ignore-vuln CVE-2026-112406
          --ignore-vuln CVE-2026-112891
          --ignore-vuln CVE-2026-112892
          --ignore-vuln CVE-2026-112893
          --ignore-vuln CVE-2026-112894
          --ignore-vuln CVE-2026-112900
          --ignore-vuln CVE-2026-112901
          --ignore-vuln CVE-2026-114501
          --ignore-vuln CVE-2026-96636
          --ignore-vuln CVE-2026-96637
          --ignore-vuln CVE-2026-96638
          --ignore-vuln CVE-2026-96639
          --ignore-vuln CVE-2026-96640
          --ignore-vuln CVE-2026-96641
          --ignore-vuln CVE-2026-96642
          --ignore-vuln CVE-2026-96643
          --ignore-vuln CVE-2026-96644
          --ignore-vuln CVE-2026-96778
          --ignore-vuln GHSA-78g4-xqwv-q3g8
