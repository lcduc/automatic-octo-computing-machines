name: Docker build

# Build verification only — this proves the image still assembles; it does not
# push or deploy anywhere.
#
# Deliberately NOT run on pull requests: the build installs torch + paddlepaddle
# + the full ML stack and then bakes the embedding and reranker weights into the
# image via `python -m scripts.download_models`, which is a multi-GB, network-
# bound operation. Running that per-PR would dominate CI time for no extra
# signal, since the lint/test jobs in ci.yml already cover code changes.
on:
  push:
    branches: [main]
    # Skip the build when a push cannot affect the image contents.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# Read-only token: the build pushes nowhere.
permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Frees ~10-14 GB by dropping preinstalled toolchains this build does not
      # use. The ML wheels plus baked model weights can otherwise exhaust the
      # runner's disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: false
          # GitHub Actions layer cache: the expensive pip/model layers are
          # reused across runs whenever requirements.txt and the Dockerfile
          # are unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
