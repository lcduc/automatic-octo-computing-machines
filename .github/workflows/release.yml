name: Release images

# Pushing a tag v* publishes every image of that release to GHCR under the
# same tag. Client boxes only ever run these tagged images (`chatbot deploy <tag>`),
# so what was tested on staging is byte-for-byte what a client box runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chatbot-api
            context: .
            dockerfile: Dockerfile
          - image: chatbot-web
            context: frontends/widget
            dockerfile: frontends/widget/Dockerfile
          - image: chatbot-admin
            context: frontends/admin
            dockerfile: frontends/admin/Dockerfile
          - image: chatbot-ops
            context: .
            dockerfile: deploy/ops/Dockerfile
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The API image (torch, paddle, baked model weights) needs the room.
      - name: Free disk space
        if: matrix.image == 'chatbot-api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
