version: 2

updates:
  # Python dependencies. requirements.txt pins exact versions on purpose
  # (torch/transformers/paddlepaddle have to move together; torch and
  # torchvision are pinned in requirements-torch.txt, paddlepaddle in the
  # Dockerfile), so these PRs are the intended way to bump them — one at a
  # time, with CI proving the suite still passes.
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch bumps are usually safe and noisy individually; batch them.
      patch-updates:
        update-types:
          - patch
    ignore:
      # Major bumps (openai 1->3, transformers 4->5, ...) are API-breaking and
      # get closed unmerged; do them by hand when wanted.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These four are version-locked to each other and to a hardware-specific
      # wheel index; a lone Dependabot bump would break the pairing the
      # requirements-torch.txt/Dockerfile comments warn about. Upgrade them together,
      # by hand, after re-verifying the paddle oneDNN bug (PaddlePaddle#77340).
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchaudio
      - dependency-name: paddlepaddle

  # The internal Streamlit demo pins its own few dependencies.
  - package-ecosystem: pip
    directory: "/frontends/streamlit"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # CI tools (ruff, pytest, pip-audit) used as pip constraints by the workflows.
  - package-ecosystem: pip
    directory: "/.github"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Chat widget and admin web. Lockfiles pin every transitive version; these PRs
  # move them, and the npm audit step in ci.yml reports what is still exposed.
  - package-ecosystem: npm
    directories:
      - "/frontends/widget"
      - "/frontends/admin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types:
          - patch
    ignore:
      # Majors (next, react, vite, ...) change APIs; do them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images of every Dockerfile. The parser only sees FROM at the start of
  # a line, so keep FROM lines unindented.
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontends/widget"
      - "/frontends/admin"
      - "/deploy/ops"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The backend venv, the torch/paddle wheels and CI are all Python 3.11;
      # moving to a newer Python is a deliberate change across all of them.
      - dependency-name: "python"
        versions: [">= 3.12"]

  # Keep the workflow actions themselves current (checkout, setup-python, ...).
  # Workflows pin each action to a commit SHA with its version in a comment;
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
