version: 2

updates:
  # Python dependencies. requirements.txt pins exact versions on purpose
  # (torch/transformers/paddlepaddle have to move together; torch and
  # torchvision are pinned in requirements-torch.txt, paddlepaddle in the
  # Dockerfile), so these PRs are the intended way to bump them — one at a
  # time, with CI proving the suite still passes.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch bumps are usually safe and noisy individually; batch them.
      patch-updates:
        update-types:
          - patch
    ignore:
      # Major bumps (openai 1->3, transformers 4->5, ...) are API-breaking and
      # get closed unmerged; do them by hand when wanted.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These four are version-locked to each other and to a hardware-specific
      # wheel index; a lone Dependabot bump would break the pairing the
      # requirements-torch.txt/Dockerfile comments warn about. Upgrade them together,
      # by hand, after re-verifying the paddle oneDNN bug (PaddlePaddle#77340).
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchaudio
      - dependency-name: paddlepaddle

  # Keep the workflow actions themselves current (checkout, setup-python, ...).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
