# One-command deployment on a single VPS:   docker compose up -d --build
#
#   caddy  :80/:443  -> web :3000 (Next.js: widget, embed.js, admin web)
#   web              -> api :8500 (FastAPI, GPU)      [internal network only]
#   api              -> postgres :5432 (pgvector)     [internal network only]
#
# Configuration: `.env` (backend + database) and `frontends/vieclamhatinh/.env`
# (web). See docs/DEPLOYMENT.md.

name: chatbot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Reachable from the host only (for backups / psql), never from outside.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-cu126}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Only the web container can reach the API, so its forwarded client IPs are trusted.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    # GPU for embeddings / reranking / OCR. Needs the NVIDIA Container Toolkit
    # on the host; remove this block (and build with TORCH_INDEX=cpu) without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m

  web:
    build: ./frontends/vieclamhatinh
    restart: unless-stopped
    env_file: ./frontends/vieclamhatinh/.env
    environment:
      BACKEND_URL: http://api:8500
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
