version: "3.8"

services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    environment:
      # OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key_here}
      - OPENAI_MODEL=gpt-4o-mini
      - OPENAI_MAX_TOKENS=7000
      - OPENAI_TEMPERATURE=0.2
      - OPENAI_TIMEOUT=30

      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8500
      - DEBUG=False
      - RELOAD=False
      - UVICORN_WORKERS=1

      # Logging Configuration
      - LOG_LEVEL=ERROR
      - LOG_TO_FILE=False
      - LOG_DIR=data/logs

      # LLM Config optimizations
      - LLM_CACHE_ENABLED=True
      - LLM_CACHE_TTL=3600
      - LLM_CACHE_MAX_ENTRIES=1000
      - MAX_CONTEXT_LENGTH=5000 

      # CORS Configuration
      - CORS_ORIGINS=*
      - CORS_ALLOW_CREDENTIALS=True

      # File Upload Configuration
      - MAX_FILE_SIZE=52428800
      - ALLOWED_EXTENSIONS=.txt,.pdf,.docx,.doc,.csv,.xlsx,.xls
      - MAX_FILES_PER_BATCH=10
      - MAX_TOTAL_BATCH_SIZE=209715200

      # Simple OCR Configuration
      - DOCLING_OCR_ENABLED=true
      - TESSERACT_CMD=/usr/bin/tesseract
      - OCR_CONCURRENT_PAGES=2
      - OCR_MAX_CONCURRENT_FILES=1
      - OCR_FORCE_ALL_PDFS=false
      - OCR_FORCE_FULL_PAGE=true

      # Data Structure Paths
      - CHUNKS_DIR=data/chunks
      - VECTORS_DIR=data/vectors
      - TEMP_DIR=data/temp
      - VECTOR_STORE_PATH=data/vectors/vector_store.pkl
      - RAG_QUERY_ADAPTER_PATH=data/vectors/query_adapter.npy

      # RAG Configuration
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - RERANKING_ENABLED=true
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L6-v2
      - RETRIEVAL_TOP_K=3
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=0

      # Vector Store Configuration
      - VECTOR_STORE_BACKEND=optimized
      - USE_FAISS_INDEX=True
      - CACHE_EMBEDDINGS=True
      - EMBEDDING_BATCH_SIZE=32

      # Vietnamese Preprocessing Configuration
      - VIETNAMESE_PREPROCESSING_ENABLED=True
      - CLEAN_SPECIAL_CHARS=True
      - EXTRACT_CONTENT_WORDS=True

      # Health Check Configuration
      - HEALTH_CHECK_INTERVAL=30
      - HEALTH_CHECK_TIMEOUT=30
      - HEALTH_CHECK_START_PERIOD=5
      - HEALTH_CHECK_RETRIES=3

      # GPU support
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
    env_file:
      - .env
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount logs directory for log persistence
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    command: uvicorn main:app --host 0.0.0.0 --port 8500 --workers ${UVICORN_WORKERS}

