services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8500:8500"

    # Always have defaults for critical vars
    command: ["/app/start.sh"]

    environment:
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_MAX_TOKENS
      - OPENAI_TEMPERATURE
      - OPENAI_TIMEOUT
      - HOST
      - PORT
      - DEBUG
      - RELOAD
      - UVICORN_WORKERS
      - LOG_LEVEL
      - LOG_TO_FILE
      - LOG_DIR
      - LLM_CACHE_ENABLED
      - LLM_CACHE_TTL
      - LLM_CACHE_MAX_ENTRIES
      - MAX_CONTEXT_LENGTH
      - CORS_ORIGINS
      - CORS_ALLOW_CREDENTIALS
      - MAX_FILE_SIZE
      - ALLOWED_EXTENSIONS
      - MAX_FILES_PER_BATCH
      - MAX_TOTAL_BATCH_SIZE
      - DOCLING_OCR_ENABLED
      - TESSERACT_CMD
      - OCR_CONCURRENT_PAGES
      - OCR_MAX_CONCURRENT_FILES
      - OCR_FORCE_ALL_PDFS
      - OCR_FORCE_FULL_PAGE
      - CHUNKS_DIR
      - VECTORS_DIR
      - TEMP_DIR
      - VECTOR_STORE_PATH
      - RAG_QUERY_ADAPTER_PATH
      - EMBEDDING_MODEL
      - RERANKER_ENABLED
      - RERANKER_MODEL
      - RETRIEVAL_TOP_K
      - CHUNK_SIZE
      - CHUNK_OVERLAP
      - VECTOR_STORE_BACKEND
      - USE_FAISS_INDEX
      - CACHE_EMBEDDINGS
      - EMBEDDING_BATCH_SIZE
      - VIETNAMESE_PREPROCESSING_ENABLED
      - CLEAN_SPECIAL_CHARS
      - EXTRACT_CONTENT_WORDS
      - HEALTH_CHECK_INTERVAL
      - HEALTH_CHECK_TIMEOUT
      - HEALTH_CHECK_START_PERIOD
      - HEALTH_CHECK_RETRIES
    env_file:
      - .env

    # Bind mounts must be writable by 'app' user inside container
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./SSL:/app/SSL:ro
      
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://localhost:8500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Compose-native resource hints (not strict limits)
    deploy: # <- optional to remove; ignored by Compose
      resources: {}

    security_opt:
      - no-new-privileges:true

    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
