# Production stack for one client box, installed and driven by the ops CLI
# (`chatbot install | deploy | backup | rollback`; see docs/DEPLOYMENT.md).
# Local development: docker-compose.override.yml (merged automatically in this
# checkout, never copied to a client box) builds the images from source.
#
#   caddy    :80/:443  -> web :3000 (widget, embed.js, BFF)        [edge]
#                      -> admin :80 (admin SPA)                     [edge]
#                      -> api :8500 /api/v1/admin/* on ADMIN domain [edge]
#   web      -> api :8500 with its generated BFF_SERVICE_TOKEN      [edge]
#   api      -> postgres, model-server, LLM provider (internet)     [internal, edge]
#   ingestion-worker -> postgres, model-server (OCR, embeddings)    [internal, egress]
#   model-server  the only GPU user: embedding, reranker, OCR       [internal]
#   migrate  one-shot `alembic upgrade head` as the schema owner    [internal]
#   postgres reachable from `internal` only; no host port           [internal]
#
# Every secret comes from the installer-generated `.env` (0600) and
# `secrets/` (0700); nothing here is edited by hand on a client box.

name: chatbot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

# Shared by migrate, api, ingestion-worker and model-server: one image, one .env, one data volume.
x-backend: &backend
  <<: *hardening
  image: ${REGISTRY:-ghcr.io/lcduc}/chatbot-api:${IMAGE_TAG:-dev}
  env_file: .env
  volumes:
    - ./data:/app/data
  tmpfs:
    - /tmp:size=512m

x-gpu: &gpu
  driver: nvidia
  count: 1
  capabilities: [gpu]

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      # Read by deploy/postgres/10-app-role.sh (also re-run by `chatbot deploy`).
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-chatbot_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run the installer to generate secrets}
    secrets: [postgres_owner_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-3g}

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [internal]

  model-server:
    <<: *backend
    command: ["python", "model_server.py"]
    environment:
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN:?run the installer to generate secrets}
    volumes:
      # Read-only: the query adapter (data/query_adapter.npy), if one was built.
      - ./data:/app/data:ro
      - ./data/logs:/app/data/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8600/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot may still download model weights that were not baked into the image.
      start_period: 600s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: ${MODEL_SERVER_MEMORY:-5g}
        reservations:
          devices: [*gpu]

  api:
    <<: *backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_APP_USER:-chatbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?run the installer to generate secrets}
      # Only web and caddy can reach the API, so their forwarded client IPs are trusted.
      FORWARDED_ALLOW_IPS: "*"
      # Uploads are parsed by ingestion-worker, never inside the API process.
      INGESTION_WORKER: external
      # The migrate service already applied the schema as its owner.
      MIGRATE_ON_START: "false"
      # The host site's public signing key (generated by the installer; used when HOST_AUTH_MODE=rs256).
      HOST_JWT_PUBLIC_KEY_FILE: /run/secrets/host_jwt_public_key
      MODEL_SERVER_URL: http://model-server:8600
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN}
    secrets: [host_jwt_public_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    networks: [internal, edge]
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-2g}

  ingestion-worker:
    <<: *backend
    command: ["python", "worker.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_APP_USER:-chatbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?run the installer to generate secrets}
      MODEL_SERVER_URL: http://model-server:8600
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN}
      # The worker's alert checks probe the API (service-down alert, OBS-04).
      MONITOR_API_READY_URL: http://api:8500/health/ready
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    # The image's healthcheck probes the API port, which the worker does not serve.
    healthcheck:
      disable: true
    networks: [internal, egress]
    # Hard caps so parsing can never starve the API or the host: an OOM here
    # kills (and restarts) only this container; its upload is retried.
    # Keep OCR_CPU_THREADS below WORKER_CPUS.
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-3}"
          memory: ${WORKER_MEMORY:-3g}
    # On SIGTERM the worker hands its upload back to the queue right away.
    stop_grace_period: 30s

  web:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/lcduc}/chatbot-web:${IMAGE_TAG:-dev}
    environment:
      BACKEND_URL: http://api:8500
      BFF_SERVICE_TOKEN: ${BFF_SERVICE_TOKEN:?run the installer to generate secrets}
      VISITOR_COOKIE_SECRET: ${VISITOR_COOKIE_SECRET:?run the installer to generate secrets}
      WIDGET_ALLOWED_PARENTS: ${HOST_ORIGIN:?set HOST_ORIGIN (the site embedding the widget)}
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-384m}

  # Admin web (static SPA), served on PUBLIC_DOMAIN_ADMIN only; shared by every client deployment.
  admin:
    <<: *hardening
    image: ${REGISTRY:-ghcr.io/lcduc}/chatbot-admin:${IMAGE_TAG:-dev}
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 128m

  caddy:
    <<: *hardening
    image: caddy:2.10
    environment:
      PUBLIC_DOMAIN_CHAT: ${PUBLIC_DOMAIN_CHAT:?set PUBLIC_DOMAIN_CHAT}
      PUBLIC_DOMAIN_ADMIN: ${PUBLIC_DOMAIN_ADMIN:?set PUBLIC_DOMAIN_ADMIN (the admin web's own domain)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  # Public-facing services and the API they proxy to.
  edge: {}
  # Database and internal services: no route to or from the internet.
  internal:
    internal: true
  # Outbound internet for the worker (hosted OCR, alerts) without being reachable from caddy.
  egress: {}

# File-based secrets live in secrets/ (directory 0700); the files themselves are
# world-readable so the unprivileged postgres and app users inside the containers
# can read them, while the directory keeps them private on the host.
secrets:
  postgres_owner_password:
    file: ./secrets/postgres_owner_password
  host_jwt_public_key:
    file: ./secrets/host_jwt_public.pem

volumes:
  pgdata:
  caddy_data:
  caddy_config:
