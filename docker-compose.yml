services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8500:8500"

    command: ["start.sh"]

    # All configuration comes from .env (see .env.example for the full list).
    # A previous explicit `environment:` pass-through list is intentionally gone:
    # it drifted from config/settings.py and silently dropped new variables.
    env_file:
      - .env

    # Bind mounts must be writable by the 'app' user inside the container
    volumes:
      - ./data:/app/data
      - ./SSL:/app/SSL:ro

    restart: unless-stopped

    # Matches the Dockerfile: try HTTPS (self-signed tolerated), fall back to HTTP
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8500/ || curl -fsS http://localhost:8500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:noexec,nosuid,size=100m
