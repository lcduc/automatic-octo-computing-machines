# One-command deployment on a single VPS:   docker compose up -d --build
#
#   caddy  :80/:443  -> web :3000 (Next.js: widget, embed.js, admin web)
#   web              -> api :8500 (FastAPI, GPU)      [internal network only]
#   api              -> postgres :5432 (pgvector)     [internal network only]
#   ingestion-worker -> postgres (parses/OCRs uploads queued by api; shares ./data)
#
# Configuration: `.env` (backend + database; `FRONTEND` picks the client folder
# under frontends/) and `frontends/<client>/.env` (web). See docs/DEPLOYMENT.md.

name: chatbot

# Shared by api and ingestion-worker: one image, one .env, one data volume.
x-backend: &backend
  build:
    context: .
    args:
      TORCH_INDEX: ${TORCH_INDEX:-cu126}
  image: chatbot-backend:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=512m

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Reachable from the host only (for backups / psql), never from outside.
    ports:
      - "127.0.0.1:5432:5432"

  api:
    <<: *backend
    environment:
      POSTGRES_HOST: postgres
      # Only the web container can reach the API, so its forwarded client IPs are trusted.
      FORWARDED_ALLOW_IPS: "*"
      # Uploads are parsed by ingestion-worker, never inside the API process.
      INGESTION_WORKER: external
    depends_on:
      postgres:
        condition: service_healthy
    # GPU for embeddings / reranking. Needs the NVIDIA Container Toolkit on the
    # host; remove this block (and build with TORCH_INDEX=cpu) without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingestion-worker:
    <<: *backend
    command: ["python", "worker.py"]
    environment:
      POSTGRES_HOST: postgres
    # Started after api is healthy, i.e. after api has applied the migrations.
    depends_on:
      api:
        condition: service_healthy
    # The image's healthcheck probes the API port, which the worker does not serve.
    healthcheck:
      disable: true
    # Hard caps so parsing can never starve the API or the host: an OOM here
    # kills (and restarts) only this container; its upload is retried.
    # Keep OCR_CPU_THREADS below WORKER_CPUS.
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-3}"
          memory: ${WORKER_MEMORY:-6g}
        # GPU for OCR (PaddleOCR-VL) and embeddings; remove without a GPU, like api's.
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # On SIGTERM the worker hands its upload back to the queue right away.
    stop_grace_period: 30s

  web:
    build: ./frontends/${FRONTEND:?set FRONTEND in .env to a folder under frontends/}
    restart: unless-stopped
    env_file: ./frontends/${FRONTEND}/.env
    environment:
      BACKEND_URL: http://api:8500
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
