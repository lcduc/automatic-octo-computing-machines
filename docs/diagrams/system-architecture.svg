<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-labelledby="system-architecture-title system-architecture-desc"><title id="system-architecture-title">System architecture</title><desc id="system-architecture-desc">Browsers reach Caddy, which routes to the widget web, admin SPA and API. The API uses PostgreSQL, the GPU model server and an external LLM provider; the ingestion worker uses PostgreSQL and the model server.</desc><style>
:root{--paper:#faf9f6;--surface:#ffffff;--ink:#2d3142;--muted:#6b7080;--rule:#cfcbc2;--accent:#eb6c36;--accent-soft:#fdebe2}
@media (prefers-color-scheme:dark){:root{--paper:#16181d;--surface:#1e2027;--ink:#e8e6e1;--muted:#9a9ea8;--rule:#454955;--accent:#f08a5d;--accent-soft:#3a2a22}}
.n{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.n.ext{stroke-dasharray:4 3}
.n.hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.t{font:600 13px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.s{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.e{fill:none;stroke:var(--ink);stroke-width:1.25}
.e.dash{stroke-dasharray:4 3}
.e.hot{stroke:var(--accent)}
.a{fill:var(--ink)}
.a.hot{fill:var(--accent)}
.l{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.m{fill:var(--paper)}
</style><rect x="0" y="0" width="960" height="560" fill="var(--paper)"/><rect class="n" x="380" y="40" width="200" height="56" rx="6"/><text class="t" x="480.0" y="66.0" text-anchor="middle">Browsers</text><text class="s" x="480.0" y="83.0" text-anchor="middle">visitors + staff</text><rect class="n" x="380" y="136" width="200" height="56" rx="6"/><text class="t" x="480.0" y="162.0" text-anchor="middle">Caddy</text><text class="s" x="480.0" y="179.0" text-anchor="middle">TLS, routing by domain</text><rect class="n" x="120" y="240" width="200" height="56" rx="6"/><text class="t" x="220.0" y="266.0" text-anchor="middle">Widget web</text><text class="s" x="220.0" y="283.0" text-anchor="middle">Next.js, holds chat API key</text><rect class="n" x="640" y="240" width="200" height="56" rx="6"/><text class="t" x="740.0" y="266.0" text-anchor="middle">Admin SPA</text><text class="s" x="740.0" y="283.0" text-anchor="middle">static, own domain</text><rect class="n hot" x="380" y="344" width="200" height="56" rx="6"/><text class="t" x="480.0" y="370.0" text-anchor="middle">API</text><text class="s" x="480.0" y="387.0" text-anchor="middle">FastAPI :8500</text><rect class="n ext" x="700" y="344" width="200" height="56" rx="6"/><text class="t" x="800.0" y="370.0" text-anchor="middle">LLM provider</text><text class="s" x="800.0" y="387.0" text-anchor="middle">OpenAI / Anthropic / Gemini</text><rect class="n" x="100" y="464" width="200" height="56" rx="6"/><text class="t" x="200.0" y="490.0" text-anchor="middle">PostgreSQL</text><text class="s" x="200.0" y="507.0" text-anchor="middle">pgvector, internal only</text><rect class="n" x="380" y="464" width="200" height="56" rx="6"/><text class="t" x="480.0" y="490.0" text-anchor="middle">Ingestion worker</text><text class="s" x="480.0" y="507.0" text-anchor="middle">parse + OCR, own limits</text><rect class="n" x="660" y="464" width="200" height="56" rx="6"/><text class="t" x="760.0" y="490.0" text-anchor="middle">Model server</text><text class="s" x="760.0" y="507.0" text-anchor="middle">GPU: embed, rerank, OCR</text><path class="e" d="M480 96 L480 136"/><polygon class="a" points="476,130 484,130 480,136"/><path class="e" d="M380 164 L228.0 164.0 Q220 164 220.0 172.0 L220 240"/><polygon class="a" points="216,234 224,234 220,240"/><rect class="m" x="228" y="198" width="74" height="14"/><text class="l" x="232" y="208">chat domain</text><path class="e" d="M580 164 L732.0 164.0 Q740 164 740.0 172.0 L740 240"/><polygon class="a" points="736,234 744,234 740,240"/><rect class="m" x="748" y="198" width="80" height="14"/><text class="l" x="752" y="208">admin domain</text><path class="e" d="M480 192 L480 344"/><polygon class="a" points="476,338 484,338 480,344"/><rect class="m" x="484" y="266" width="98" height="14"/><text class="l" x="488" y="276">/api/v1/admin/*</text><path class="e" d="M220 296 L220.0 364.0 Q220 372 228.0 372.0 L380 372"/><polygon class="a" points="374,368 374,376 380,372"/><rect class="m" x="228" y="326" width="86" height="14"/><text class="l" x="232" y="336">service token</text><path class="e" d="M580 372 L700 372"/><polygon class="a" points="694,368 694,376 700,372"/><rect class="m" x="610" y="354" width="44" height="14"/><text class="l" x="614" y="364">stream</text><path class="e" d="M420 400 L420.0 424.0 Q420 432 412.0 432.0 L208.0 432.0 Q200 432 200.0 440.0 L200 464"/><polygon class="a" points="196,458 204,458 200,464"/><path class="e" d="M540 400 L540.0 424.0 Q540 432 548.0 432.0 L752.0 432.0 Q760 432 760.0 440.0 L760 464"/><polygon class="a" points="756,458 764,458 760,464"/><path class="e" d="M380 492 L300 492"/><polygon class="a" points="306,488 306,496 300,492"/><path class="e" d="M580 492 L660 492"/><polygon class="a" points="654,488 654,496 660,492"/></svg>