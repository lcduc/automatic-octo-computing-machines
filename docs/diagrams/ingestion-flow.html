<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document ingestion</title>
<style>
:root{--paper:#faf9f6;--surface:#ffffff;--ink:#2d3142;--muted:#6b7080;--rule:#cfcbc2;--accent:#eb6c36;--accent-soft:#fdebe2}
@media (prefers-color-scheme:dark){:root{--paper:#16181d;--surface:#1e2027;--ink:#e8e6e1;--muted:#9a9ea8;--rule:#454955;--accent:#f08a5d;--accent-soft:#3a2a22}}
.n{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.n.ext{stroke-dasharray:4 3}
.n.hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.t{font:600 13px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.s{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.e{fill:none;stroke:var(--ink);stroke-width:1.25}
.e.dash{stroke-dasharray:4 3}
.e.hot{stroke:var(--accent)}
.a{fill:var(--ink)}
.a.hot{fill:var(--accent)}
.l{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.m{fill:var(--paper)}

body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 'Geist',system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:40px 16px 48px}
.eyebrow{font:400 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 40px/1.1 'Instrument Serif',Georgia,serif;margin:6px 0 8px}
p{margin:0 0 24px;color:var(--muted);max-width:640px}
footer{margin-top:16px;font:400 11px 'Geist Mono',ui-monospace,monospace;color:var(--muted)}
</style></head><body><main>
<div class="eyebrow">Flow</div><h1>Document ingestion</h1><p>Uploads return immediately; a separate worker does the slow parsing so a crash cannot take the API down.</p>

.n{fill:var(--surface);stroke:var(--rule);stroke-width:1}

.s{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.e{fill:none;stroke:var(--ink);stroke-width:1.25}

.m{fill:var(--paper)}
