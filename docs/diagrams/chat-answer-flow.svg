<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" role="img" aria-labelledby="chat-answer-flow-title chat-answer-flow-desc"><title id="chat-answer-flow-title">How a question is answered</title><desc id="chat-answer-flow-desc">A visitor message passes guardrails, is rewritten, retrieved and reranked. If no knowledge is relevant the reply is a fallback with no LLM call; otherwise a grounded, cited answer is generated, cached and metered.</desc><style>
:root{--paper:#faf9f6;--surface:#ffffff;--ink:#2d3142;--muted:#6b7080;--rule:#cfcbc2;--accent:#eb6c36;--accent-soft:#fdebe2}
@media (prefers-color-scheme:dark){:root{--paper:#16181d;--surface:#1e2027;--ink:#e8e6e1;--muted:#9a9ea8;--rule:#454955;--accent:#f08a5d;--accent-soft:#3a2a22}}
.n{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.n.ext{stroke-dasharray:4 3}
.n.hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.t{font:600 13px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}
.s{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.e{fill:none;stroke:var(--ink);stroke-width:1.25}
.e.dash{stroke-dasharray:4 3}
.e.hot{stroke:var(--accent)}
.a{fill:var(--ink)}
.a.hot{fill:var(--accent)}
.l{font:400 10px 'Geist Mono',ui-monospace,Consolas,monospace;fill:var(--muted)}
.m{fill:var(--paper)}
</style><rect x="0" y="0" width="1000" height="540" fill="var(--paper)"/><rect class="n" x="50" y="72" width="180" height="72" rx="6"/><text class="t" x="140.0" y="106.0" text-anchor="middle">Visitor message</text><text class="s" x="140.0" y="123.0" text-anchor="middle">widget, streamed reply</text><rect class="n" x="290" y="72" width="180" height="72" rx="6"/><text class="t" x="380.0" y="106.0" text-anchor="middle">Guardrails</text><text class="s" x="380.0" y="123.0" text-anchor="middle">PII mask, injection, moderation</text><rect class="n" x="530" y="72" width="180" height="72" rx="6"/><text class="t" x="620.0" y="106.0" text-anchor="middle">Rewrite follow-up</text><text class="s" x="620.0" y="123.0" text-anchor="middle">standalone question</text><rect class="n" x="770" y="72" width="180" height="72" rx="6"/><text class="t" x="860.0" y="106.0" text-anchor="middle">Retrieve + rerank</text><text class="s" x="860.0" y="123.0" text-anchor="middle">semantic + BM25, cross-encoder</text><rect class="n" x="290" y="250" width="180" height="64" rx="6"/><text class="t" x="380.0" y="280.0" text-anchor="middle">Canned / fallback</text><text class="s" x="380.0" y="297.0" text-anchor="middle">greeting, deny or handoff</text><polygon class="n hot" points="860.0,230 960,282.0 860.0,334 760,282.0"/><text class="t" x="860.0" y="286.0" text-anchor="middle">Relevant knowledge?</text><rect class="n" x="770" y="418" width="180" height="72" rx="6"/><text class="t" x="860.0" y="452.0" text-anchor="middle">Grounded answer</text><text class="s" x="860.0" y="469.0" text-anchor="middle">LLM with citations</text><rect class="n" x="530" y="418" width="180" height="72" rx="6"/><text class="t" x="620.0" y="452.0" text-anchor="middle">Cache + meter</text><text class="s" x="620.0" y="469.0" text-anchor="middle">tokens per visitor / day</text><path class="e" d="M230 108 L290 108"/><polygon class="a" points="284,104 284,112 290,108"/><path class="e" d="M470 108 L530 108"/><polygon class="a" points="524,104 524,112 530,108"/><path class="e" d="M710 108 L770 108"/><polygon class="a" points="764,104 764,112 770,108"/><path class="e" d="M860 144 L860 230"/><polygon class="a" points="856,224 864,224 860,230"/><path class="e" d="M380 144 L380 250"/><polygon class="a" points="376,244 384,244 380,250"/><rect class="m" x="384" y="190" width="164" height="14"/><text class="l" x="388" y="200">blocked / greeting / human</text><path class="e hot" d="M760 282 L470 282"/><polygon class="a hot" points="476,278 476,286 470,282"/><rect class="m" x="556" y="264" width="134" height="14"/><text class="l" x="560" y="274">no: skip the LLM call</text><path class="e" d="M860 334 L860 418"/><polygon class="a" points="856,412 864,412 860,418"/><rect class="m" x="864" y="370" width="26" height="14"/><text class="l" x="868" y="380">yes</text><path class="e" d="M770 454 L710 454"/><polygon class="a" points="716,450 716,458 710,454"/></svg>